<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Caccia alla Targa Multiplayer</title>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --found: #10b981;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 50px;
    }

    header {
      width: 100%;
      max-width: 580px;
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .room-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      width: 100%;
      max-width: 580px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .room-bar span b {
      color: var(--accent);
    }

    .btn-small {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal Lobby */
    #lobbyModal, #adminModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-box h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    .tab-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent);
    }

    .existing-rooms-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
    }

    .room-item:hover {
      border-color: var(--accent);
    }

    .room-item-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .room-item-info {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .room-badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .admin-link-btn {
      margin-top: 14px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: center;
    }

    /* Classifica Leaderboard */
    #leaderboardCard {
      display: none;
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .leaderboard-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    /* Input Targa */
    .input-card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .plate-input-wrapper {
      display: flex;
      gap: 10px;
    }

    input[type="number"] {
      flex: 1;
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      outline: none;
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    button.btn-add {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      padding: 0 24px;
      cursor: pointer;
    }

    /* Statistica Totale */
    .total-card {
      width: 100%;
      max-width: 580px;
      background: linear-gradient(135deg, #1e293b, #1e1b4b);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }

    .total-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--found);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Centinaia */
    .hundreds-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hundred-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .hundred-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
    }

    .hundred-title {
      font-weight: 700;
    }

    .hundred-badge {
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .numbers-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid var(--border);
      max-height: 260px;
      overflow-y: auto;
    }

    .hundred-card.open .numbers-grid {
      display: grid;
    }

    .number-badge {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .number-badge.found {
      background: var(--found);
      color: #0f172a;
      border-color: var(--found);
      font-weight: 700;
    }

    .btn-delete-room {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Modal Accesso / Scelta Partita -->
  <div id="lobbyModal">
    <div class="modal-box">
      <h2>🚗 Unisciti alla Partita</h2>

      <div class="field">
        <label>Tuo Nome Giocatore</label>
        <input type="text" id="playerNameInput" placeholder="Es: Marco" />
      </div>

      <div class="tab-buttons">
        <button class="tab-btn active" id="tabJoin" onclick="switchTab('join')">Partite Attive</button>
        <button class="tab-btn" id="tabCreate" onclick="switchTab('create')">+ Nuova Partita</button>
      </div>

      <!-- Vista: Entra in una partita esistente -->
      <div id="viewJoin">
        <div class="field">
          <label>Seleziona una Partita</label>
          <div class="existing-rooms-list" id="roomsList">
            <div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 12px;">
              Caricamento partite...
            </div>
          </div>
        </div>
      </div>

      <!-- Vista: Crea nuova partita -->
      <div id="viewCreate" style="display: none;">
        <div class="field">
          <label>Nome o Codice Partita</label>
          <input type="text" id="newRoomIdInput" placeholder="Es: VIAGGIO-MARE" style="text-transform: uppercase;" />
        </div>
        <div class="field">
          <label>Modalità di Gioco</label>
          <select id="newGameModeInput" onchange="onModeChange()">
            <option value="coop">🤝 Cooperazione (Album unico condiviso)</option>
            <option value="vs">⚔️ Tutti contro Tutti (Gara a punti)</option>
          </select>
        </div>
        
        <!-- Mostrato solo se si sceglie "Tutti contro Tutti" -->
        <div class="field" id="ruleContainer" style="display: none;">
          <label>Regola Targhe Duplicate (Solo in Sfida)</label>
          <select id="newGameRuleInput">
            <option value="exclusive">🔒 Targa Unica (il primo la blocca agli altri)</option>
            <option value="shared">👥 Tutti possono segnarla (Album individuali)</option>
          </select>
        </div>
        <button class="btn-primary" id="btnCreateRoom">Crea e Inizia</button>
      </div>

      <button class="admin-link-btn" onclick="openAdminModal()">⚙️ Area Gestore Admin</button>
    </div>
  </div>

  <!-- Modal Admin Gestore -->
  <div id="adminModal" style="display: none;">
    <div class="modal-box">
      <h2>⚙️ Pannello Gestore</h2>
      
      <!-- Login Admin -->
      <div id="adminLoginView">
        <div class="field">
          <label>Username</label>
          <input type="text" id="adminUser" placeholder="Username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="Password" />
        </div>
        <button class="btn-primary" onclick="checkAdminLogin()">Accedi</button>
        <button class="btn-small" style="width:100%; margin-top: 8px; background: transparent;" onclick="closeAdminModal()">Chiudi</button>
      </div>

      <!-- Elenco Eliminazione Partite (dopo login) -->
      <div id="adminDashboardView" style="display: none;">
        <p style="font-size:0.85rem; color:var(--text-dim); margin-bottom:12px;">Elimina definitivamente una stanza dal cloud:</p>
        <div class="existing-rooms-list" id="adminRoomsList"></div>
        <button class="btn-small" style="width:100%; margin-top: 12px; background: #334155;" onclick="closeAdminModal()">Esci dal Pannello</button>
      </div>
    </div>
  </div>

  <header>
    <h1>🚗 Caccia alla Targa</h1>
  </header>

  <!-- Barra Info Partita Attiva -->
  <div class="room-bar">
    <span>Stanza: <b id="displayRoom">--</b> (<span id="displayMode">--</span>)</span>
    <button class="btn-small" onclick="location.reload()">Esci</button>
  </div>

  <!-- Classifica (Visibile in modalità VS) -->
  <div id="leaderboardCard">
    <div class="leaderboard-title">🏆 Classifica Giocatori</div>
    <div id="leaderboardList"></div>
  </div>

  <!-- Input Targa -->
  <div class="input-card">
    <div class="plate-input-wrapper">
      <input 
        type="number" 
        id="plateInput" 
        placeholder="Es: 42 o 042" 
        inputmode="numeric" 
        min="0" 
        max="999"
        autocomplete="off"
      />
      <button class="btn-add" id="btnAdd">Visto!</button>
    </div>
  </div>

  <!-- Statistiche Totali -->
  <div class="total-card">
    <div class="total-header">
      <span id="totalHeaderLabel">Targhe Trovate</span>
      <span id="totalText">0 / 1000 (0.0%)</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="totalFill"></div>
    </div>
  </div>

  <!-- Griglia Centinaia -->
  <div class="hundreds-container" id="hundredsContainer"></div>

  <script>
    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAOrQRQ3A5_6-38JD8BdvRppk5msJ9ygU8",
      authDomain: "caccia-alla-targa.firebaseapp.com",
      databaseURL: "https://caccia-alla-targa-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "caccia-alla-targa",
      storageBucket: "caccia-alla-targa.firebasestorage.app",
      messagingSenderId: "144747793446",
      appId: "1:144747793446:web:fb5bd9e73f0fc43b056ae7",
      measurementId: "G-7NMJEFPYWV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Stato locale della sessione
    let currentRoom = "";
    let currentPlayer = "";
    let currentMode = "coop";      // 'coop' o 'vs'
    let currentRule = "exclusive"; // 'exclusive' o 'shared'
    let roomPlates = {};
    let allRoomsCache = {};

    function pad(n) {
      return n.toString().padStart(3, "0");
    }

    function switchTab(tab) {
      document.getElementById("tabJoin").classList.toggle("active", tab === "join");
      document.getElementById("tabCreate").classList.toggle("active", tab === "create");
      document.getElementById("viewJoin").style.display = tab === "join" ? "block" : "none";
      document.getElementById("viewCreate").style.display = tab === "create" ? "block" : "none";
    }

    // Mostra/Nasconde l'opzione "Regola Targhe Duplicate" in base alla modalità scelta
    function onModeChange() {
      const mode = document.getElementById("newGameModeInput").value;
      const ruleContainer = document.getElementById("ruleContainer");
      if (mode === "vs") {
        ruleContainer.style.display = "block";
      } else {
        ruleContainer.style.display = "none";
      }
    }

    // Ascolto stanze disponibili
    db.ref("rooms").on("value", (snapshot) => {
      allRoomsCache = snapshot.val() || {};
      renderRoomsList();
      renderAdminRoomsList();
    });

    function renderRoomsList() {
      const listEl = document.getElementById("roomsList");
      const roomKeys = Object.keys(allRoomsCache);

      if (roomKeys.length === 0) {
        listEl.innerHTML = `
          <div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 16px;">
            Nessuna partita attiva.<br>Creane una toccando <b>'+ Nuova Partita'</b> in alto!
          </div>
        `;
        return;
      }

      listEl.innerHTML = "";
      roomKeys.forEach((key) => {
        const roomData = allRoomsCache[key] || {};
        const meta = roomData.meta || {};
        const isVs = meta.mode === "vs";
        const modeLabel = isVs ? "⚔️ Gara" : "🤝 Coop";
        const ruleLabel = isVs ? (meta.rule === "shared" ? "👥 Libera" : "🔒 Esclusiva") : "";
        const count = roomData.plates ? Object.keys(roomData.plates).length : 0;

        const item = document.createElement("div");
        item.className = "room-item";
        item.innerHTML = `
          <div>
            <div class="room-item-name">${key}</div>
            <div class="room-item-info">
              <span class="room-badge">${modeLabel}</span>
              ${ruleLabel ? `<span class="room-badge" style="color:#a78bfa; background:rgba(167,139,250,0.1);">${ruleLabel}</span>` : ""}
              <span>${count} registrate</span>
            </div>
          </div>
          <span style="color: var(--accent); font-weight: 700;">Entra &rarr;</span>
        `;
        item.onclick = () => joinRoom(key, meta.mode || "coop", meta.rule || "exclusive");
        listEl.appendChild(item);
      });
    }

    // Costruzione delle 10 centinaia
    const container = document.getElementById("hundredsContainer");
    for (let h = 0; h < 10; h++) {
      const start = h * 100;
      const end = start + 99;

      const card = document.createElement("div");
      card.className = "hundred-card";
      card.id = `hundred-${h}`;
      card.innerHTML = `
        <div class="hundred-header" onclick="document.getElementById('hundred-${h}').classList.toggle('open')">
          <span class="hundred-title">${pad(start)} - ${pad(end)}</span>
          <span class="hundred-badge" id="badge-${h}">0% (0)</span>
        </div>
        <div class="numbers-grid" id="grid-${h}"></div>
      `;
      container.appendChild(card);

      const grid = card.querySelector(`#grid-${h}`);
      for (let i = start; i <= end; i++) {
        const item = document.createElement("div");
        item.className = "number-badge";
        item.id = `num-${i}`;
        item.textContent = pad(i);
        item.addEventListener("click", () => togglePlate(i));
        grid.appendChild(item);
      }
    }

    // Entra in una stanza
    function joinRoom(roomKey, mode, rule) {
      const name = document.getElementById("playerNameInput").value.trim();
      if (!name) {
        alert("Inserisci prima il tuo Nome in cima!");
        document.getElementById("playerNameInput").focus();
        return;
      }

      currentPlayer = name;
      currentRoom = roomKey;
      currentMode = mode;
      currentRule = mode === "coop" ? "exclusive" : rule;

      const modeText = (currentMode === "vs" ? "Gara ⚔️" : "Coop 🤝") + (currentMode === "vs" ? (currentRule === "shared" ? " (Libera)" : " (Blocco)") : "");
      document.getElementById("displayRoom").textContent = currentRoom;
      document.getElementById("displayMode").textContent = modeText;

      if (currentMode === "vs") {
        document.getElementById("leaderboardCard").style.display = "block";
      }

      document.getElementById("lobbyModal").style.display = "none";
      listenToRoomChanges();
    }

    // Crea una stanza
    document.getElementById("btnCreateRoom").addEventListener("click", () => {
      const name = document.getElementById("playerNameInput").value.trim();
      let room = document.getElementById("newRoomIdInput").value.trim().toUpperCase();
      const mode = document.getElementById("newGameModeInput").value;
      // Se è Coop la regola di default è l'album unico condiviso (exclusive)
      const rule = mode === "vs" ? document.getElementById("newGameRuleInput").value : "exclusive";

      if (!name) {
        alert("Inserisci prima il tuo nome!");
        return;
      }
      if (!room) {
        alert("Inserisci un codice o nome per la partita!");
        return;
      }

      const cleanRoom = room.replace(/[^A-Z0-9_-]/g, "");
      const roomRef = db.ref(`rooms/${cleanRoom}`);

      roomRef.child("meta").set({ 
        mode: mode, 
        rule: rule, 
        created: Date.now() 
      }, (err) => {
        if (!err) {
          joinRoom(cleanRoom, mode, rule);
        }
      });
    });

    // Ascolto modifiche in tempo reale delle targhe
    function listenToRoomChanges() {
      db.ref(`rooms/${currentRoom}/plates`).on("value", (snapshot) => {
        roomPlates = snapshot.val() || {};
        updateUI();
      });
    }

    // Toggle Targa con gestione delle regole
    function togglePlate(num) {
      const padNum = pad(num);
      const plateRef = db.ref(`rooms/${currentRoom}/plates/${padNum}`);
      const plateData = roomPlates[padNum];

      if (currentMode === "coop" || currentRule === "exclusive") {
        // Targa bloccata / album unico cooperativo
        if (plateData) {
          if (currentMode === "coop" || plateData.foundBy === currentPlayer) {
            plateRef.remove();
          } else {
            alert(`Targa già registrata da ${plateData.foundBy}!`);
          }
        } else {
          plateRef.set({
            foundBy: currentPlayer,
            timestamp: Date.now()
          });
        }
      } else {
        // Tutti contro tutti con targhe libere (album individuali)
        const userPlateRef = db.ref(`rooms/${currentRoom}/plates/${padNum}/players/${currentPlayer}`);
        const alreadyFoundByMe = plateData && plateData.players && plateData.players[currentPlayer];

        if (alreadyFoundByMe) {
          userPlateRef.remove().then(() => {
            plateRef.once("value", (snap) => {
              const val = snap.val();
              if (val && (!val.players || Object.keys(val.players).length === 0)) {
                plateRef.remove();
              }
            });
          });
        } else {
          userPlateRef.set(true);
        }
      }
    }

    function addPlate() {
      const input = document.getElementById("plateInput");
      const val = parseInt(input.value, 10);

      if (isNaN(val) || val < 0 || val > 999) {
        alert("Inserisci un numero valido da 0 a 999");
        return;
      }

      togglePlate(val);
      const h = Math.floor(val / 100);
      document.getElementById(`hundred-${h}`).classList.add("open");
      input.value = "";
      input.focus();
    }

    document.getElementById("btnAdd").addEventListener("click", addPlate);
    document.getElementById("plateInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") addPlate();
    });

    // Aggiornamento grafico dell'interfaccia
    function updateUI() {
      const scores = {};
      let myTotalCount = 0;

      for (let i = 0; i < 1000; i++) {
        const padNum = pad(i);
        const el = document.getElementById(`num-${i}`);
        const data = roomPlates[padNum];

        let isMarkedByMe = false;

        if (currentMode === "coop" || currentRule === "exclusive") {
          if (data) {
            isMarkedByMe = true;
            el.title = `Trovata da: ${data.foundBy}`;
            scores[data.foundBy] = (scores[data.foundBy] || 0) + 1;
          }
        } else {
          if (data && data.players) {
            Object.keys(data.players).forEach(p => {
              scores[p] = (scores[p] || 0) + 1;
            });
            if (data.players[currentPlayer]) {
              isMarkedByMe = true;
            }
            el.title = `Segnata da: ${Object.keys(data.players).join(", ")}`;
          }
        }

        if (isMarkedByMe) {
          el.classList.add("found");
          myTotalCount++;
        } else {
          el.classList.remove("found");
          if (!data) el.title = "";
        }
      }

      // Percentuali per centinaio
      for (let h = 0; h < 10; h++) {
        let count = 0;
        const start = h * 100;
        for (let i = start; i < start + 100; i++) {
          const padNum = pad(i);
          const data = roomPlates[padNum];
          if (currentMode === "coop" || currentRule === "exclusive") {
            if (data) count++;
          } else {
            if (data && data.players && data.players[currentPlayer]) count++;
          }
        }
        document.getElementById(`badge-${h}`).textContent = `${count}% (${count}/100)`;
      }

      // Totale
      const displayTotal = (currentMode === "coop" || currentRule === "exclusive") ? Object.keys(roomPlates).length : myTotalCount;
      const totalPct = ((displayTotal / 1000) * 100).toFixed(1);
      document.getElementById("totalText").textContent = `${displayTotal} / 1000 (${totalPct}%)`;
      document.getElementById("totalFill").style.width = `${totalPct}%`;
      document.getElementById("totalHeaderLabel").textContent = (currentMode === "coop" || currentRule === "exclusive") ? "Targhe Trovate (Album)" : "Tuo Completamento";

      // Classifica giocatori
      if (currentMode === "vs") {
        const listEl = document.getElementById("leaderboardList");
        listEl.innerHTML = "";

        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        if (sorted.length === 0) {
          listEl.innerHTML = "<div style='color:var(--text-dim);font-size:0.85rem;'>Nessuna targa reclamata.</div>";
        } else {
          sorted.forEach(([pName, pScore], idx) => {
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = `
              <span>${idx + 1}. <b>${pName}</b> ${pName === currentPlayer ? "(Tu)" : ""}</span>
              <span><b>${pScore}</b> punti (${((pScore / 1000) * 100).toFixed(1)}%)</span>
            `;
            listEl.appendChild(row);
          });
        }
      }
    }

    // ==========================================
    // SEZIONE AMMINISTRATORE (Chicco / Saetta95)
    // ==========================================
    function openAdminModal() {
      document.getElementById("adminModal").style.display = "flex";
      document.getElementById("adminLoginView").style.display = "block";
      document.getElementById("adminDashboardView").style.display = "none";
      document.getElementById("adminUser").value = "";
      document.getElementById("adminPass").value = "";
    }

    function closeAdminModal() {
      document.getElementById("adminModal").style.display = "none";
    }

    function checkAdminLogin() {
      const u = document.getElementById("adminUser").value.trim();
      const p = document.getElementById("adminPass").value;

      if (u === "Chicco" && p === "Saetta95") {
        document.getElementById("adminLoginView").style.display = "none";
        document.getElementById("adminDashboardView").style.display = "block";
        renderAdminRoomsList();
      } else {
        alert("Credenziali errate!");
      }
    }

    function renderAdminRoomsList() {
      const container = document.getElementById("adminRoomsList");
      if (!container) return;

      const keys = Object.keys(allRoomsCache);
      if (keys.length === 0) {
        container.innerHTML = "<div style='color:var(--text-dim);font-size:0.85rem;text-align:center;'>Nessuna stanza presente.</div>";
        return;
      }

      container.innerHTML = "";
      keys.forEach((key) => {
        const item = document.createElement("div");
        item.className = "room-item";
        item.innerHTML = `
          <div>
            <div class="room-item-name">${key}</div>
            <div class="room-item-info">
              <span>${allRoomsCache[key].plates ? Object.keys(allRoomsCache[key].plates).length : 0} targhe salvate</span>
            </div>
          </div>
          <button class="btn-delete-room" onclick="deleteRoom('${key}')">Elimina</button>
        `;
        container.appendChild(item);
      });
    }

    function deleteRoom(roomKey) {
      if (confirm(`Sei sicuro di voler eliminare la partita '${roomKey}' per tutti i giocatori?`)) {
        db.ref(`rooms/${roomKey}`).remove().then(() => {
          alert(`Partita '${roomKey}' eliminata con successo.`);
        });
      }
    }
  </script>
</body>
