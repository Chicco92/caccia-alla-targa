<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Caccia alla Targa Multiplayer</title>

  <!-- Firebase Compat SDKs (compatibili direttamente nel browser senza compilatori) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --found: #10b981;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 50px;
    }

    header {
      width: 100%;
      max-width: 580px;
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .room-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      width: 100%;
      max-width: 580px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .room-bar span b {
      color: var(--accent);
    }

    .btn-small {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Finestra di Accesso / Creazione Stanza */
    #lobbyModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-box h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    input[type="text"], select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Classifica Gara */
    #leaderboardCard {
      display: none;
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .leaderboard-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    /* Input Targa */
    .input-card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .plate-input-wrapper {
      display: flex;
      gap: 10px;
    }

    input[type="number"] {
      flex: 1;
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      outline: none;
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    button.btn-add {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      padding: 0 24px;
      cursor: pointer;
    }

    /* Avanzamento Totale */
    .total-card {
      width: 100%;
      max-width: 580px;
      background: linear-gradient(135deg, #1e293b, #1e1b4b);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }

    .total-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--found);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Griglie Centinaia */
    .hundreds-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hundred-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .hundred-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
    }

    .hundred-title {
      font-weight: 700;
    }

    .hundred-badge {
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .numbers-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid var(--border);
      max-height: 260px;
      overflow-y: auto;
    }

    .hundred-card.open .numbers-grid {
      display: grid;
    }

    .number-badge {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .number-badge.found {
      background: var(--found);
      color: #0f172a;
      border-color: var(--found);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Modal Lobby Iniziale -->
  <div id="lobbyModal">
    <div class="modal-box">
      <h2>🚗 Unisciti alla Partita</h2>
      <div class="field">
        <label>Tuo Nome</label>
        <input type="text" id="playerNameInput" placeholder="Es: Marco" />
      </div>
      <div class="field">
        <label>Codice Stanza (es: VIAGGIO)</label>
        <input type="text" id="roomIdInput" placeholder="Es: VIAGGIO24" style="text-transform: uppercase;" />
      </div>
      <div class="field">
        <label>Modalità di Gioco</label>
        <select id="gameModeInput">
          <option value="coop">🤝 Cooperazione (Stesso album insieme)</option>
          <option value="vs">⚔️ Tutti contro Tutti (Gara a punti)</option>
        </select>
      </div>
      <button class="btn-primary" id="btnJoin">Inizia a Giocare</button>
    </div>
  </div>

  <header>
    <h1>🚗 Caccia alla Targa</h1>
  </header>

  <!-- Barra Info Partita -->
  <div class="room-bar">
    <span>Stanza: <b id="displayRoom">--</b> (<span id="displayMode">--</span>)</span>
    <button class="btn-small" onclick="location.reload()">Esci</button>
  </div>

  <!-- Classifica (Visibile solo in modalità VS) -->
  <div id="leaderboardCard">
    <div class="leaderboard-title">🏆 Classifica Giocatori</div>
    <div id="leaderboardList"></div>
  </div>

  <!-- Inserimento rapido -->
  <div class="input-card">
    <div class="plate-input-wrapper">
      <input 
        type="number" 
        id="plateInput" 
        placeholder="Es: 42 o 042" 
        inputmode="numeric" 
        min="0" 
        max="999"
        autocomplete="off"
      />
      <button class="btn-add" id="btnAdd">Visto!</button>
    </div>
  </div>

  <!-- Totale -->
  <div class="total-card">
    <div class="total-header">
      <span>Targhe Trovate</span>
      <span id="totalText">0 / 1000 (0.0%)</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="totalFill"></div>
    </div>
  </div>

  <!-- Contenitore Centinaia -->
  <div class="hundreds-container" id="hundredsContainer"></div>

  <script>
    // ==========================================
    // CONFIGURAZIONE FIREBASE CON LE TUE CHIAVI
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAOrQRQ3A5_6-38JD8BdvRppk5msJ9ygU8",
      authDomain: "caccia-alla-targa.firebaseapp.com",
      databaseURL: "https://caccia-alla-targa-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "caccia-alla-targa",
      storageBucket: "caccia-alla-targa.firebasestorage.app",
      messagingSenderId: "144747793446",
      appId: "1:144747793446:web:fb5bd9e73f0fc43b056ae7",
      measurementId: "G-7NMJEFPYWV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Stato locale della sessione
    let currentRoom = "";
    let currentPlayer = "";
    let currentMode = "coop";
    let roomPlates = {};

    function pad(n) {
      return n.toString().padStart(3, "0");
    }

    // Costruzione delle 10 centinaia
    const container = document.getElementById("hundredsContainer");
    for (let h = 0; h < 10; h++) {
      const start = h * 100;
      const end = start + 99;

      const card = document.createElement("div");
      card.className = "hundred-card";
      card.id = `hundred-${h}`;
      card.innerHTML = `
        <div class="hundred-header" onclick="document.getElementById('hundred-${h}').classList.toggle('open')">
          <span class="hundred-title">${pad(start)} - ${pad(end)}</span>
          <span class="hundred-badge" id="badge-${h}">0% (0)</span>
        </div>
        <div class="numbers-grid" id="grid-${h}"></div>
      `;
      container.appendChild(card);

      const grid = card.querySelector(`#grid-${h}`);
      for (let i = start; i <= end; i++) {
        const item = document.createElement("div");
        item.className = "number-badge";
        item.id = `num-${i}`;
        item.textContent = pad(i);
        item.addEventListener("click", () => togglePlate(i));
        grid.appendChild(item);
      }
    }

    // Accesso alla stanza
    document.getElementById("btnJoin").addEventListener("click", () => {
      const name = document.getElementById("playerNameInput").value.trim();
      let room = document.getElementById("roomIdInput").value.trim().toUpperCase();
      const mode = document.getElementById("gameModeInput").value;

      if (!name || !room) {
        alert("Inserisci sia il nome che il codice stanza!");
        return;
      }

      currentPlayer = name;
      currentRoom = room.replace(/[^A-Z0-9_-]/g, "");

      const roomRef = db.ref(`rooms/${currentRoom}`);
      roomRef.child("meta").once("value", (snap) => {
        const meta = snap.val();
        if (meta && meta.mode) {
          currentMode = meta.mode;
        } else {
          currentMode = mode;
          roomRef.child("meta").set({ mode: currentMode, created: Date.now() });
        }

        document.getElementById("displayRoom").textContent = currentRoom;
        document.getElementById("displayMode").textContent = currentMode === "coop" ? "Coop 🤝" : "Gara ⚔️";
        if (currentMode === "vs") {
          document.getElementById("leaderboardCard").style.display = "block";
        }

        document.getElementById("lobbyModal").style.display = "none";
        listenToRoomChanges();
      });
    });

    // Ascolto Firebase in tempo reale
    function listenToRoomChanges() {
      db.ref(`rooms/${currentRoom}/plates`).on("value", (snapshot) => {
        roomPlates = snapshot.val() || {};
        updateUI();
      });
    }

    function togglePlate(num) {
      const padNum = pad(num);
      const plateRef = db.ref(`rooms/${currentRoom}/plates/${padNum}`);

      if (roomPlates[padNum]) {
        // Se già registrata: rimozione permessa solo se in coop o se aggiunta dallo stesso giocatore
        if (currentMode === "coop" || roomPlates[padNum].foundBy === currentPlayer) {
          plateRef.remove();
        } else {
          alert(`Targa già presa da ${roomPlates[padNum].foundBy}!`);
        }
      } else {
        plateRef.set({
          foundBy: currentPlayer,
          timestamp: Date.now()
        });
      }
    }

    function addPlate() {
      const input = document.getElementById("plateInput");
      const val = parseInt(input.value, 10);

      if (isNaN(val) || val < 0 || val > 999) {
        alert("Inserisci un numero da 0 a 999");
        return;
      }

      togglePlate(val);
      const h = Math.floor(val / 100);
      document.getElementById(`hundred-${h}`).classList.add("open");
      input.value = "";
      input.focus();
    }

    document.getElementById("btnAdd").addEventListener("click", addPlate);
    document.getElementById("plateInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") addPlate();
    });

    // Aggiornamento grafico
    function updateUI() {
      const scores = {};

      for (let i = 0; i < 1000; i++) {
        const padNum = pad(i);
        const el = document.getElementById(`num-${i}`);
        const found = roomPlates[padNum];

        if (found) {
          el.classList.add("found");
          el.title = `Trovata da: ${found.foundBy}`;
          scores[found.foundBy] = (scores[found.foundBy] || 0) + 1;
        } else {
          el.classList.remove("found");
          el.title = "";
        }
      }

      for (let h = 0; h < 10; h++) {
        let count = 0;
        const start = h * 100;
        for (let i = start; i < start + 100; i++) {
          if (roomPlates[pad(i)]) count++;
        }
        document.getElementById(`badge-${h}`).textContent = `${count}% (${count}/100)`;
      }

      const totalCount = Object.keys(roomPlates).length;
      const totalPct = ((totalCount / 1000) * 100).toFixed(1);
      document.getElementById("totalText").textContent = `${totalCount} / 1000 (${totalPct}%)`;
      document.getElementById("totalFill").style.width = `${totalPct}%`;

      if (currentMode === "vs") {
        const listEl = document.getElementById("leaderboardList");
        listEl.innerHTML = "";

        const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        if (sortedPlayers.length === 0) {
          listEl.innerHTML = "<div style='color:var(--text-dim);font-size:0.85rem;'>Nessuna targa reclamata.</div>";
        } else {
          sortedPlayers.forEach(([pName, pScore], idx) => {
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = `
              <span>${idx + 1}. <b>${pName}</b> ${pName === currentPlayer ? "(Tu)" : ""}</span>
              <span><b>${pScore}</b> punti (${((pScore / 1000) * 100).toFixed(1)}%)</span>
            `;
            listEl.appendChild(row);
          });
        }
      }
    }
  </script>
</body>
</html>
